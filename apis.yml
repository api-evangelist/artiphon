aid: artiphon
name: Artiphon
description: Artiphon is a Nashville-based music technology company that designs smart,
  portable musical instruments for everyday creativity. Its products, including the
  Instrument 1, Orba, Orba 2, Orba 3, and Chorda, combine strumming, tapping, sliding,
  and looping into palm-sized MIDI controllers and synthesizers, paired with companion
  apps that let anyone make beats, loop sounds, and explore music anywhere. Artiphon
  sells direct and through retailers such as Guitar Center and Sweetwater. It does
  not currently publish a public developer API; this profile is maintained in the
  API Evangelist network as a consumer-hardware company reference.
